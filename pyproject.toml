[project]
name = "hh-leads"
version = "1.0.0"
description = "Local hh.ru chat leads dashboard"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "openpyxl>=3.1.2",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
hh-leads = "hh_leads.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
